<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="روتین صبح">
<meta name="theme-color" content="#E9EFF4">
<title>روتین صبح</title>
<link rel="apple-touch-icon" id="icon" href="">
<style>
:root{
  --bg:#E9EFF4; --card:#FFFFFF; --ink:#172033; --mute:#6B778C; --line:#D5DEE7;
  --sun:#E8A33D; --sun-soft:#FBEBCF; --miss:#C2473D; --miss-soft:#F6DAD6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:"Vazirmatn","Geeza Pro","Damascus","Tahoma",system-ui,sans-serif;
  padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;line-height:1.6;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 18px}
.date{font-size:28px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.sub{font-size:14px;color:var(--mute);margin-top:2px}
.back{font-size:13px;font-weight:700;background:var(--ink);color:#fff;border-radius:99px;padding:6px 14px;white-space:nowrap}

.week{display:flex;gap:6px;margin-bottom:16px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 8px;border-radius:14px;background:transparent;border:2px solid transparent;min-width:0}
.day[aria-pressed="true"]{background:var(--card);border-color:var(--ink)}
.day:disabled{opacity:.35;cursor:default}
.segs{display:flex;flex-direction:column-reverse;gap:3px}
.seg{width:20px;height:9px;border-radius:3px;border:1.5px solid var(--line);background:transparent}
.seg.on{background:var(--sun);border-color:var(--sun)}
.seg.miss{background:var(--miss-soft);border-color:var(--miss)}
.wd{font-size:12px;color:var(--mute)}
.dn{font-size:15px;font-weight:700}

.list{background:var(--card);border-radius:22px;padding:6px 6px}
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:15px 12px;border-radius:16px}
.task + .task{border-top:1px solid var(--line);border-radius:0}
.task:active{background:var(--bg)}
.box{flex:none;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;transition:transform .15s,background .15s,border-color .15s}
.box svg{width:18px;height:18px;opacity:0;transform:scale(.4);transition:all .15s}
.task.done .box{background:var(--sun);border-color:var(--sun);transform:scale(1.06)}
.task.done .box svg{opacity:1;transform:none}
.task.missed .box{border-color:var(--miss);background:var(--miss-soft)}
.t{font-size:18px;font-weight:700}
.task.done .t{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1.5px}
.h{font-size:13px;color:var(--mute)}
.pts{margin-inline-start:auto;font-size:14px;font-weight:800;color:var(--mute);min-width:34px;text-align:left}
.task.done .pts{color:#B97A12}
.task.missed .pts{color:var(--miss)}

.score{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--card);border-radius:18px;padding:12px 14px}
.stat b{display:block;font-size:30px;line-height:1.2;font-weight:800}
.stat.main b{font-size:40px}
.stat span.l{font-size:13px;color:var(--mute)}
.neg{color:var(--miss)}
.num{unicode-bidi:isolate;direction:ltr;display:inline-block}

.note{font-size:13px;color:var(--mute);margin:14px 4px 0}
.reset{display:block;margin:22px auto 0;font-size:13px;color:var(--mute);text-decoration:underline;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <div class="date" id="date"></div>
    <div class="sub" id="sub"></div>
  </div>
  <button class="back" id="back" hidden>برگشت به امروز</button>
</header>

<div class="week" id="week" role="group" aria-label="هفتهٔ اخیر"></div>
<div class="list" id="list"></div>
<div class="score" id="score"></div>
<p class="note">برای هر کار انجام‌شده ۱+ و برای هر کار انجام‌نشدهٔ روزهای گذشته ۱− حساب می‌شود. امروز تا نیمه‌شب منفی ندارد.</p>
<button class="reset" id="reset">پاک کردن همهٔ داده‌ها</button>

<script>
const TASKS=[
  {t:"بلند شدن ساعت ۶", h:"بدون چرت"},
  {t:"مسواک / دوش", h:""},
  {t:"۲۰ دقیقه ورزش", h:"اسکات، شنا یا حرکات ورزشی"},
  {t:"صبحانه", h:""}
];
const N=TASKS.length, KEY="morning-routine-v1";
const faNum=n=>new Intl.NumberFormat("fa-IR",{useGrouping:false}).format(n);
const fmt=(d,o)=>new Intl.DateTimeFormat("fa-IR-u-ca-persian",o).format(d);
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d,12)};
const signed=n=>(n>0?"+":n<0?"−":"")+faNum(Math.abs(n));

let state=load()||{start:key(new Date()),days:{}};
let sel=key(new Date());
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const getDay=k=>state.days[k]||Array(N).fill(false);

function stats(todayK){
  let total=0,perfect=0,missed=0;
  for(let d=fromKey(state.start);key(d)<=todayK;d.setDate(d.getDate()+1)){
    const k=key(d),a=getDay(k),done=a.filter(Boolean).length;
    total+=done;
    if(k<todayK){total-=(N-done);missed+=N-done}
    if(done===N)perfect++;
  }
  return{total,perfect,missed};
}

function render(){
  const today=new Date(), tk=key(today);
  if(state.start>tk)state.start=tk;
  if(!sel||sel>tk||sel<state.start)sel=tk;
  const sd=fromKey(sel), isToday=sel===tk, arr=getDay(sel);

  document.getElementById("date").textContent=fmt(sd,{day:"numeric",month:"long"});
  document.getElementById("sub").textContent=fmt(sd,{weekday:"long",year:"numeric"})+(isToday?"":" · ویرایش روز گذشته");
  document.getElementById("back").hidden=isToday;

  // week strip
  const w=document.getElementById("week");w.innerHTML="";
  for(let i=6;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);d.setHours(12);
    const k=key(d),a=getDay(k),b=document.createElement("button");
    b.className="day";b.disabled=k<state.start;b.setAttribute("aria-pressed",k===sel);
    b.setAttribute("aria-label",fmt(d,{weekday:"long",day:"numeric",month:"long"}));
    b.innerHTML='<div class="segs">'+a.map(v=>'<i class="seg '+(v?"on":(k<tk&&k>=state.start?"miss":""))+'"></i>').join("")+
      '</div><span class="wd">'+fmt(d,{weekday:"short"})+'</span><span class="dn">'+fmt(d,{day:"numeric"})+'</span>';
    b.onclick=()=>{sel=k;render()};
    w.appendChild(b);
  }

  // tasks
  const list=document.getElementById("list");list.innerHTML="";
  TASKS.forEach((t,i)=>{
    const done=arr[i],past=sel<tk;
    const b=document.createElement("button");
    b.className="task"+(done?" done":(past?" missed":""));
    b.setAttribute("aria-pressed",done);
    b.innerHTML='<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#172033" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'+
      '<span><div class="t">'+t.t+'</div>'+(t.h?'<div class="h">'+t.h+'</div>':'')+'</span>'+
      '<span class="pts"><span class="num">'+(done?"+۱":(past?"−۱":"۰"))+'</span></span>';
    b.onclick=()=>{
      const a=getDay(sel).slice();a[i]=!a[i];state.days[sel]=a;save();
      if(navigator.vibrate)navigator.vibrate(8);render();
    };
    list.appendChild(b);
  });

  // score
  const s=stats(tk);
  document.getElementById("score").innerHTML=
    '<div class="stat main"><b class="'+(s.total<0?"neg":"")+'"><span class="num">'+signed(s.total)+'</span></b><span class="l">امتیاز کل</span></div>'+
    '<div class="stat"><b>'+faNum(s.perfect)+'</b><span class="l">روز کامل</span></div>'+
    '<div class="stat"><b class="neg"><span class="num">'+(s.missed?"−":"")+faNum(s.missed)+'</span></b><span class="l">امتیاز منفی</span></div>';
}

document.getElementById("back").onclick=()=>{sel=key(new Date());render()};
document.getElementById("reset").onclick=()=>{
  if(confirm("همهٔ تیک‌ها و امتیازها پاک شود؟")){state={start:key(new Date()),days:{}};save();sel=state.start;render()}
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(sel===key(new Date(Date.now()-864e5)))sel=key(new Date());render()}});

// home-screen icon (generated, no external files)
(function(){
  const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");
  x.fillStyle="#172033";x.fillRect(0,0,180,180);
  x.fillStyle="#E8A33D";x.beginPath();x.arc(90,118,46,Math.PI,0);x.fill();
  x.fillStyle="#E8A33D";[[-62,-4],[-44,-40],[0,-58],[44,-40],[62,-4]].forEach(([dx,dy],i)=>{
    const a=Math.atan2(dy,dx);x.save();x.translate(90,118);x.rotate(a);x.fillRect(58,-3,22,6);x.restore();
  });
  x.fillRect(20,122,140,6);
  document.getElementById("icon").href=c.toDataURL("image/png");
})();

render();
</script>
</body>
</html>
